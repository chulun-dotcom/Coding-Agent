name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[api]'
      - run: python scripts/run_tests.py

  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[api]'
      - run: docker build -t shi-agent-python:test docker/python
      - run: docker build -t shi-agent-java:test docker/java
      - run: python scripts/run_tests.py
        env:
          SHI_AGENT_RUN_DOCKER_TESTS: "1"
